# Fast SecLoRA regression. It intentionally overrides default.yaml's real
# model and MMLU dataset while keeping the same secure-aggregation interface.

seed: 42

federated:
  num_clients: 2
  num_rounds: 1
  local_steps: 2

lora:
  rank: 2
  alpha: 4
  target_modules: ["linear"]

train:
  batch_size: 4
  learning_rate: 2.0e-4
  optimizer: adamw
  weight_decay: 0.0
  dtype: float32

model:
  kind: dummy
  hidden_size: 16

dataset:
  kind: dummy
  split_method: iid_uniform
  num_samples: 32
  input_dim: 16
  output_dim: 16

secure_aggregation:
  backend: seclora
  mode: sel-2s
  ratio: 0.10
  sfp: 12
  xmax: 1.0
  threads: 25

logging:
  level: INFO

tensorboard:
  port: 6006
