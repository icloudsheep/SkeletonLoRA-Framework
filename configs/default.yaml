# Default config: local OpenLLaMA 3B + local MMLU auxiliary training set.

seed: 42

federated:
  num_clients: 4
  num_rounds: 10
  local_steps: 300

lora:
  rank: 4
  alpha: 8
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

train:
  batch_size: 4
  learning_rate: 2.0e-4
  optimizer: adamw
  weight_decay: 0.0
  dtype: float32

model:
  kind: open_llama              # dispatch key -> models/open_llama.py (loads from local path)
  name: open_llama_3b_v2        # switch to open_llama_7b_v2 for the formal run
  path: ./models/open_llama_3b_v2
  dtype: float32

dataset:
  kind: mmlu_train
  split_method: iid_uniform
  path: ./datasets/mmlu/mmlu_auxiliary_train.jsonl
  max_length: 512

logging:
  level: INFO

tensorboard:
  port: 6006
