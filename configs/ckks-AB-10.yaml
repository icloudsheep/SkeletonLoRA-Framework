# Default training config extended with SkeletonLoRA CKKS aggregation.

seed: 42

federated:
  num_clients: 4
  num_rounds: 3
  local_steps: 300

lora:
  rank: 4
  alpha: 8
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

train:
  batch_size: 4
  learning_rate: 2.0e-4
  optimizer: adamw
  weight_decay: 0.0
  dtype: float32

model:
  kind: open_llama
  name: open_llama_3b_v2
  path: ./models/open_llama_3b_v2
  dtype: float32

dataset:
  kind: mmlu_train
  split_method: iid_uniform
  path: ./datasets/mmlu/mmlu_auxiliary_train.jsonl
  max_length: 512

encryption:
  scheme: ckks
  mode: partial_AB
  ratio: 10
  skeleton: false
  skeleton_rank: 16
  poly_modulus_degree: 8192
  coeff_mod_bit_sizes: [60, 40, 40, 60]
  global_scale: 1099511627776
  cur_condition_threshold: 1.0e12

logging:
  level: INFO

tensorboard:
  port: 6006
