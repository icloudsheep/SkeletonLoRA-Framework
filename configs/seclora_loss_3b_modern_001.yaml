seed: 42

federated:
  num_clients: 2
  num_rounds: 100
  local_steps: 60

lora:
  rank: 4
  alpha: 8
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

train:
  batch_size: 2
  learning_rate: 2.0e-4
  optimizer: adamw
  weight_decay: 0.0
  dtype: float32
  loss_moving_average_window: 300
  loss_moving_average_across_rounds: true
  lr_scheduler:
    type: cosine
    warmup_steps: 300
    min_learning_rate: 2.0e-5

model:
  kind: open_llama
  name: open_llama_3b_v2
  path: ./models/open_llama_3b_v2
  dtype: float32

dataset:
  kind: natural_instructions
  split_method: iid_uniform
  path: ./datasets/natural-instructions
  max_length: 1024
  max_samples: 20000

secure_aggregation:
  backend: seclora
  mode: sel-2s
  ratio: 0.01
  sfp: 22
  xmax: 0.03125
  threads: 25

logging:
  level: INFO

tensorboard:
  port: 6006
