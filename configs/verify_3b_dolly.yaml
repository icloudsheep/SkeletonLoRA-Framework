# Minimal real-resource verification: OpenLLaMA 3B + Dolly 15k.

seed: 42

federated:
  num_clients: 2
  num_rounds: 1
  local_steps: 1

lora:
  rank: 2
  alpha: 4
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

train:
  batch_size: 1
  learning_rate: 2.0e-4
  optimizer: adamw
  weight_decay: 0.0
  dtype: float16

model:
  kind: open_llama
  name: open_llama_3b_v2
  path: ./models/open_llama_3b_v2
  dtype: float16

dataset:
  kind: dolly_15k
  split_method: iid_uniform
  path: ./datasets/databricks-dolly-15k/databricks-dolly-15k.jsonl
  max_length: 128

encryption:
  scheme: ckks
  mode: partial_AB
  ratio: 0
  skeleton: false
  skeleton_rank: 4
  poly_modulus_degree: 8192
  coeff_mod_bit_sizes: [60, 40, 40, 60]
  global_scale: 1099511627776
  cur_condition_threshold: 1.0e12

logging:
  level: INFO

tensorboard:
  port: 6006
